name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: Generated code is current
        working-directory: backend
        run: |
          go tool -modfile=tools.mod sqlc generate
          go tool -modfile=tools.mod oapi-codegen -config internal/api/tenantapi/oapi.yaml ../api/openapi/tenant.yaml
          go tool -modfile=tools.mod oapi-codegen -config internal/api/adminapi/oapi.yaml ../api/openapi/admin.yaml
          go tool -modfile=tools.mod oapi-codegen -config internal/api/modulesapi/oapi.yaml ../api/openapi/modules.yaml
          git diff --exit-code
      - name: Lint
        working-directory: backend
        run: go tool -modfile=tools.mod golangci-lint run ./...
      - name: Tests, including tenant isolation against real PostgreSQL
        working-directory: backend
        run: go test -race -count=1 -p 2 ./...
      - name: Known vulnerabilities
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Generated types are current
        run: pnpm gen:api && git diff --exit-code
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Known vulnerabilities
        run: pnpm audit --prod --audit-level=high
