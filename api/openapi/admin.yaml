  /outreach/jurisdiction-rules:
    get:
      operationId: listJurisdictionRules
      x-access: admin
      x-admin-roles: [super_admin, platform_support]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/JurisdictionRuleList"}}}}
