openapi: 3.0.3
info: {title: MSP Growth Engine Admin API, version: 1.0.0}
servers:
  - url: /api/v1/admin
security: [{sessionCookie: []}]
paths:
  /auth/login:
    post:
      operationId: adminLogin
      x-access: public
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdminLogin"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminLoginResult"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /auth/logout:
    post:
      operationId: adminLogout
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, integration_admin, platform_analyst]
      x-mfa-exempt: true
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /auth/password/change:
    post:
      operationId: adminChangePassword
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, integration_admin, platform_analyst]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PasswordChange"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /auth/mfa/enroll:
    post:
      operationId: adminEnrollTotp
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, integration_admin, platform_analyst]
      x-mfa-exempt: true
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TotpEnrollment"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /auth/mfa/confirm:
    post:
      operationId: adminConfirmTotp
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, integration_admin, platform_analyst]
      x-mfa-exempt: true
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MfaCode"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /auth/mfa/verify:
    post:
      operationId: adminVerifyMfa
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, integration_admin, platform_analyst]
      x-mfa-exempt: true
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MfaCode"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /me:
    get:
      operationId: getAdminContext
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, integration_admin, platform_analyst]
      x-mfa-exempt: true
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminContext"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admins:
    get:
      operationId: listAdmins
      x-access: admin
      x-admin-roles: [super_admin]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createAdmin
      x-access: admin
      x-admin-roles: [super_admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAdmin"}}}}
      responses:
        "201": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Admin"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /admins/{id}/recover:
    post:
      operationId: recoverAdmin
      x-access: admin
      x-admin-roles: [super_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/AdminRecovery"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /tenants:
    get:
      operationId: listTenants
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, platform_analyst]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TenantList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /tenants/{tenantId}:
    get:
      operationId: getTenant
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, platform_analyst]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /tenants/{tenantId}/suspend:
    post:
      operationId: suspendTenant
      x-access: admin
      x-admin-roles: [super_admin]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Reason"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /tenants/{tenantId}/reactivate:
    post:
      operationId: reactivateTenant
      x-access: admin
      x-admin-roles: [super_admin]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Reason"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Tenant"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /tenants/{tenantId}/users:
    get:
      operationId: listTenantUsers
      x-access: admin
      x-admin-roles: [super_admin, platform_support]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TenantUserList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /modules:
    get:
      operationId: listModules
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, integration_admin, platform_analyst]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ModuleList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /products:
    get:
      operationId: listProducts
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, platform_analyst]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/ProductList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createProduct
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateProduct"}}}}
      responses:
        "201": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /products/{id}/versions:
    post:
      operationId: createProductVersion
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateProductVersion"}}}}
      responses:
        "201": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /product-versions/{id}/publish:
    post:
      operationId: publishProductVersion
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Product"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /plans:
    get:
      operationId: listPlans
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, platform_analyst]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PlanList"}}}}
        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: createPlan
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreatePlan"}}}}
      responses:
        "201": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Plan"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /plans/{id}/prices:
    post:
      operationId: createPrice
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreatePrice"}}}}
      responses:
        "201": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Price"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /subscriptions:
    get:
      operationId: listAdminSubscriptions
      x-access: admin
      x-admin-roles: [super_admin, platform_support, billing_admin, platform_analyst]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /tenants/{tenantId}/subscriptions:
    post:
      operationId: createSubscription
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters:
        - {name: tenantId, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateSubscription"}}}}
      responses:
        "201": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Subscription"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /billing/purchases:
    get:
      operationId: listPurchaseQueue
      x-access: admin
      x-admin-roles: [super_admin, billing_admin, platform_analyst]
      parameters: [{name: status, in: query, required: false, schema: {type: string, maxLength: 32}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminPurchaseList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /billing/purchases/{id}/approve:
    post:
      operationId: approvePurchase
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Reason"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SubscriptionRef"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /billing/purchases/{id}/reject:
    post:
      operationId: rejectPurchase
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Reason"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /billing/bank-transfers:
    get:
      operationId: listBankTransfers
      x-access: admin
      x-admin-roles: [super_admin, billing_admin, platform_analyst]
      responses:
