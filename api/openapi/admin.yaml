      operationId: markPaymentPaid
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/PaymentReference"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /billing/refunds:
    get:
      operationId: listRefunds
      x-access: admin
      x-admin-roles: [super_admin, billing_admin, platform_analyst]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/RefundList"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /billing/payments/{id}/retry-refund:
    post:
      operationId: retryRefund
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /billing/payments/{id}/mark-refunded:
    post:
      operationId: markRefunded
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Note"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
  /billing/dunning-policy:
    get:
      operationId: getDunningPolicy
      x-access: admin
      x-admin-roles: [super_admin, billing_admin, platform_analyst]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/DunningPolicy"}}}}
        default: {$ref: "#/components/responses/Problem"}
    put:
      operationId: putDunningPolicy
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/DunningPolicy"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/DunningPolicy"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /billing/bank-instructions:
    get:
      operationId: getBankInstructions
      x-access: admin
      x-admin-roles: [super_admin, billing_admin, platform_analyst]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BankInstructions"}}}}
        default: {$ref: "#/components/responses/Problem"}
    put:
      operationId: putBankInstructions
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/BankInstructions"}}}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/BankInstructions"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /billing/reconciliation:
    get:
      operationId: getReconciliation
      x-access: admin
      x-admin-roles: [super_admin, billing_admin, platform_analyst]
      parameters: [{name: status, in: query, required: false, schema: {type: string, maxLength: 32}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Reconciliation"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /billing/reconciliation/run:
    post:
      operationId: runReconciliation
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Reconciliation"}}}}
        default: {$ref: "#/components/responses/Problem"}
  /billing/reconciliation/issues/{id}/resolve:
    post:
      operationId: resolveReconciliationIssue
      x-access: admin
      x-admin-roles: [super_admin, billing_admin]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/Note"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
