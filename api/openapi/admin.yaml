      x-admin-roles: [super_admin, platform_support]
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/AdminLegalDocument"}}}}
