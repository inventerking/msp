        default: {$ref: "#/components/responses/Problem"}
    post:
      operationId: addGlobalSuppression
      x-access: admin
      x-admin-roles: [super_admin, platform_support]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/GlobalSuppressionInput"}}}}
      responses:
        "204": {description: Done}
        default: {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: admin_session}
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    CountryCode: {name: countryCode, in: path, required: true, schema: {type: string, pattern: "^[A-Za-z]{2}$"}}
  schemas:
    JurisdictionRule:
      type: object
      required: [country_code, rule, updated_at]
      properties:
        country_code: {type: string}
        rule: {type: string, enum: [opt_out_allowed, consent_required, blocked]}
        note: {type: string}
        updated_by: {type: string, format: uuid}
        updated_at: {type: string, format: date-time}
    JurisdictionRuleList:
      type: object
      required: [data]
      properties: {data: {type: array, items: {$ref: "#/components/schemas/JurisdictionRule"}}}
    JurisdictionRuleInput:
      type: object
      required: [rule]
      additionalProperties: false
      properties:
        rule: {type: string, enum: [opt_out_allowed, consent_required, blocked]}
        note: {type: string, maxLength: 1000}
    GlobalSuppressionInput:
      type: object
      required: [email, reason]
      additionalProperties: false
      properties:
        email: {type: string, format: email, maxLength: 254}
        reason: {type: string, enum: [legal_request, abuse, complaint]}
    GlobalSuppressionCount:
      type: object
      required: [count]
      properties: {count: {type: integer}}
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code: {type: string}
        detail: {type: string}
        request_id: {type: string}
        module_key: {type: string}
        module_status: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: {type: string}
              code: {type: string}
    MfaCode:
      type: object
      required: [code]
      properties:
        code: {type: string, minLength: 6, maxLength: 32}
    TotpEnrollment:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: {type: string}
        otpauth_url: {type: string}
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: {type: array, items: {type: string}}
    Module:
      type: object
      required: [id, key, name, description, status]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        description: {type: string}
        status: {type: string}
    ModuleList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Module"}}
    Entitlement:
      type: object
      required: [key, status]
      properties:
        key: {type: string}
        status: {type: string, description: "active, inactive, pending, suspended, expired or revoked"}
        effective_until: {type: string, format: date-time, nullable: true}
    EntitlementList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Entitlement"}}
    Product:
      type: object
      required: [id, key, kind, name, description, status, version_id, version, version_status, modules]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        kind: {type: string, enum: [module, bundle, suite, addon]}
        name: {type: string}
        description: {type: string}
        status: {type: string}
        version_id: {type: string, format: uuid}
        version: {type: integer}
        version_status: {type: string}
        modules: {type: array, items: {type: string}}
    ProductList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Product"}}
    Subscription:
      type: object
      required: [id, tenant_id, plan_id, plan_name, status, currency, created_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        plan_id: {type: string, format: uuid}
        plan_name: {type: string}
        status: {type: string}
        currency: {type: string}
        current_period_end: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    SubscriptionList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Subscription"}}
    AuditEvent:
      type: object
      required: [id, actor_type, action, resource_type, outcome, occurred_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid, nullable: true}
        actor_type: {type: string}
        actor_id: {type: string, format: uuid, nullable: true}
        action: {type: string}
        resource_type: {type: string}
        resource_id: {type: string, format: uuid, nullable: true}
        outcome: {type: string}
        occurred_at: {type: string, format: date-time}
    AuditEventList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AuditEvent"}}
        next_cursor: {type: string, nullable: true}
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: {type: string, maxLength: 256}
        new_password: {type: string, minLength: 12, maxLength: 256}
    AdminRecovery:
      type: object
      required: [new_password, reason]
      properties:
        new_password: {type: string, minLength: 12, maxLength: 256}
        reason: {type: string, minLength: 3, maxLength: 500}
    AdminLogin:
      type: object
      required: [email, password]
      properties:
        email: {type: string, maxLength: 254}
        password: {type: string, maxLength: 256}
    AdminLoginResult:
      type: object
      required: [mfa_enrolled]
      properties:
        mfa_enrolled: {type: boolean}
    Admin:
      type: object
      required: [id, email, display_name, status, roles]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        status: {type: string}
        roles: {type: array, items: {type: string}}
    AdminList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Admin"}}
    AdminContext:
      type: object
      required: [admin, csrf_token, mfa_verified]
      properties:
        admin: {$ref: "#/components/schemas/Admin"}
        csrf_token: {type: string}
        mfa_verified: {type: boolean}
    CreateAdmin:
      type: object
      required: [email, display_name, password, roles]
      properties:
        email: {type: string, format: email, maxLength: 254}
        display_name: {type: string, minLength: 1, maxLength: 120}
        password: {type: string, minLength: 12, maxLength: 256}
        roles: {type: array, minItems: 1, items: {type: string, enum: [super_admin, platform_support, billing_admin, integration_admin, platform_analyst]}}
    Tenant:
      type: object
      required: [id, name, slug, status, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        slug: {type: string}
        status: {type: string}
        suspended_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}
    TenantList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Tenant"}}
        next_cursor: {type: string, nullable: true}
    TenantUser:
      type: object
      required: [user_id, email, display_name, role, status]
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string}
        display_name: {type: string}
        role: {type: string}
        status: {type: string}
    TenantUserList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/TenantUser"}}
    SubscriptionRef:
      type: object
      required: [subscription_id]
      properties:
        subscription_id: {type: string, format: uuid}
    AdminPurchase:
      type: object
      required: [id, tenant_id, tenant_name, plan_name, status, quantity, quote, waiting_hours, created_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        tenant_name: {type: string}
        plan_name: {type: string}
        status: {type: string}
        quantity: {type: integer}
        quote: {type: object, additionalProperties: true}
        payment_method: {type: string}
        invoice_id: {type: string, format: uuid}
        rejection_reason: {type: string}
        waiting_hours: {type: number, format: double}
        over_target: {type: boolean}
        created_at: {type: string, format: date-time}
        submitted_at: {type: string, format: date-time}
        reviewed_at: {type: string, format: date-time}
    AdminPurchaseList:
      type: object
      required: [data, review_target_hours]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AdminPurchase"}}
        review_target_hours: {type: integer}
    BankTransfer:
      type: object
      required: [payment_id, tenant_id, tenant_name, amount_minor, currency, purpose, created_at]
      properties:
        payment_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        tenant_name: {type: string}
        invoice_id: {type: string, format: uuid}
        invoice_number: {type: string}
        amount_minor: {type: integer, format: int64}
        currency: {type: string}
        purpose: {type: string}
        created_at: {type: string, format: date-time}
    BankTransferList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/BankTransfer"}}
    PaymentReference:
      type: object
      required: [reference]
      additionalProperties: false
      properties:
        reference: {type: string, minLength: 1, maxLength: 200}
    Refund:
      type: object
      required: [payment_id, tenant_id, tenant_name, amount_minor, currency, method, refund_status, created_at]
      properties:
        payment_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        tenant_name: {type: string}
        amount_minor: {type: integer, format: int64}
        currency: {type: string}
        method: {type: string}
        refund_status: {type: string}
        created_at: {type: string, format: date-time}
    RefundList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Refund"}}
    Note:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: {type: string, minLength: 1, maxLength: 1000}
    DunningPolicy:
      type: object
      required: [retry_days, suspend_after_days, expire_after_days, bank_transfer_due_days, review_target_hours]
      additionalProperties: false
      properties:
        retry_days: {type: array, maxItems: 10, items: {type: integer, minimum: 1, maximum: 365}}
        suspend_after_days: {type: integer, minimum: 1, maximum: 365}
        expire_after_days: {type: integer, minimum: 2, maximum: 365}
        bank_transfer_due_days: {type: integer, minimum: 1, maximum: 90}
        review_target_hours: {type: integer, minimum: 1, maximum: 720}
    BankInstructions:
      type: object
      required: [text]
      additionalProperties: false
      properties:
        text: {type: string, maxLength: 2000, description: "Shown to tenants paying by bank transfer, with the invoice number as the reference"}
    ReconciliationRun:
      type: object
      required: [id, provider, window_start, window_end, checked, issues, status, created_at]
      properties:
        id: {type: string, format: uuid}
        provider: {type: string}
        window_start: {type: string, format: date-time}
        window_end: {type: string, format: date-time}
        checked: {type: integer}
        issues: {type: integer}
        status: {type: string}
        error: {type: string}
        created_at: {type: string, format: date-time}
    ReconciliationIssue:
      type: object
      required: [id, run_id, provider, provider_ref, kind, detail, status, created_at]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        provider: {type: string}
        provider_ref: {type: string}
        payment_id: {type: string, format: uuid}
        kind: {type: string}
        detail: {type: object, additionalProperties: true}
        status: {type: string}
        note: {type: string}
        resolved_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    Reconciliation:
      type: object
      required: [runs, issues]
      properties:
        runs: {type: array, items: {$ref: "#/components/schemas/ReconciliationRun"}}
        issues: {type: array, items: {$ref: "#/components/schemas/ReconciliationIssue"}}
    AdminLegalDocument:
      type: object
      required: [id, kind, version, title, status, requires_acceptance, counsel_reviewed, accepted_count, created_at]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string}
        version: {type: integer}
        title: {type: string}
        body: {type: string}
        status: {type: string, enum: [draft, published, retired]}
        requires_acceptance: {type: boolean}
        counsel_reviewed: {type: boolean}
        accepted_count: {type: integer}
        published_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    AdminLegalDocumentList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AdminLegalDocument"}}
    LegalDraft:
      type: object
      required: [kind, title, body, requires_acceptance]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [terms, privacy, dpa, acceptable_use, subprocessors]}
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 200000}
        requires_acceptance: {type: boolean}
    PublishLegal:
      type: object
      required: [counsel_reviewed]
      additionalProperties: false
      properties:
        counsel_reviewed: {type: boolean, description: "Whether counsel reviewed this text, as you know it"}
    AbuseReport:
      type: object
      required: [id, category, details, status, created_at]
      properties:
        id: {type: string, format: uuid}
        category: {type: string}
        subject_url: {type: string}
        details: {type: string}
        reporter_email: {type: string}
        target_tenant_id: {type: string, format: uuid}
        status: {type: string, enum: [new, reviewing, actioned, dismissed]}
        decision: {type: string}
        reviewed_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
    AbuseReportList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AbuseReport"}}
    AbuseReview:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, enum: [reviewing, actioned, dismissed]}
        decision: {type: string, maxLength: 2000}
        target_tenant_id: {type: string, format: uuid}
    Reason:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
    CreateProduct:
      type: object
      required: [key, kind, name, description, module_keys]
      properties:
        key: {type: string, pattern: "^[a-z0-9_]{2,64}$"}
        kind: {type: string, enum: [module, bundle, suite, addon]}
        name: {type: string, minLength: 2, maxLength: 120}
        description: {type: string, maxLength: 2000}
        module_keys: {type: array, minItems: 1, items: {type: string}}
    CreateProductVersion:
      type: object
      required: [module_keys]
      properties:
        module_keys: {type: array, minItems: 1, items: {type: string}}
    Plan:
      type: object
      required: [id, product_version_id, key, name, billing_period, trial_days, status, prices]
      properties:
        id: {type: string, format: uuid}
        product_version_id: {type: string, format: uuid}
        key: {type: string}
        name: {type: string}
        billing_period: {type: string}
        trial_days: {type: integer}
        status: {type: string}
        prices: {type: array, items: {$ref: "#/components/schemas/Price"}}
    PlanList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/Plan"}}
    CreatePlan:
      type: object
      required: [product_version_id, key, name, billing_period, trial_days]
      properties:
        product_version_id: {type: string, format: uuid}
        key: {type: string, pattern: "^[a-z0-9_]{2,64}$"}
        name: {type: string, minLength: 2, maxLength: 120}
        billing_period: {type: string, enum: [monthly, annual, custom]}
        trial_days: {type: integer, minimum: 0, maximum: 365}
        seats: {type: integer, minimum: 1, maximum: 100000, description: "Members allowed per unit bought. Omit for no limit"}
        included_credits:
          type: object
          description: "Credits granted each paid period, by meter, such as ai_credits"
          additionalProperties: {type: integer, minimum: 0, maximum: 10000000}
    Price:
      type: object
      required: [id, currency, amount_minor, valid_from]
      properties:
        id: {type: string, format: uuid}
        currency: {type: string}
        amount_minor: {type: integer, format: int64}
        valid_from: {type: string, format: date-time}
        valid_to: {type: string, format: date-time, nullable: true}
    CreatePrice:
      type: object
      required: [currency, amount_minor]
      properties:
        currency: {type: string, minLength: 3, maxLength: 3}
        amount_minor: {type: integer, format: int64, minimum: 0}
    CreateSubscription:
      type: object
      required: [plan_id, currency]
      properties:
        plan_id: {type: string, format: uuid}
        currency: {type: string, minLength: 3, maxLength: 3}
    EntitlementChange:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500}
        effective_until: {type: string, format: date-time, nullable: true}
    EntitlementDetail:
