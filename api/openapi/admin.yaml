    patch:
      operationId: updateLegalDraft
      x-access: admin
      x-admin-roles: [super_admin]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LegalDraft"}}}}
