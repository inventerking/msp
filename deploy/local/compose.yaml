# Local development dependencies. Ports avoid the common defaults on purpose.
name: msp-engine
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    environment:
      POSTGRES_PASSWORD: dev_superuser
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msp_engine"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.33
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
  # S3-compatible file storage. The bucket stays private: files pass through the API.
  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=64", "-ip.bind=0.0.0.0"]
    ports: ["127.0.0.1:58333:8333"]
    volumes:
      - seaweed:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
  # PDF rendering. It may load only its own temporary files and inline images, with JavaScript off,
  # so content in a document cannot make it fetch other services.
  gotenberg:
    image: gotenberg/gotenberg:9.2
    command: ["gotenberg", "--chromium-deny-list=^(?!(file:///tmp/|data:)).*", "--chromium-disable-javascript=true", "--api-port=3000"]
    ports: ["127.0.0.1:58300:3000"]
  # Malware scanning. It needs a lot of memory and downloads signatures at start, so it is opt-in
  # locally: docker compose --profile scan up -d. Without it, set FILE_SCANNER=allow-all for local work.
  clamav:
    image: clamav/clamav:1.5
    profiles: ["scan"]
    ports: ["127.0.0.1:53310:3310"]
volumes:
  pgdata:
  seaweed:
