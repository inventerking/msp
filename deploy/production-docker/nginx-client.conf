# Client app on the server, behind the server's Traefik. The customer host never serves admin API
# routes, and visitor tracking goes to its own ingest process.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Traefik connects from a private Docker address and puts the visitor's address in
    # X-Forwarded-For. Take the visitor's address from there, so rate limits and audit logs see
    # the visitor rather than Traefik.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Re-resolve the backend's address so a restarted container is found again. The msp-* names
    # are aliases that cannot clash with other stacks on the shared Traefik network.
    resolver 127.0.0.11 valid=10s;
    set $api http://msp-api:8088;
    set $ingest http://msp-ingest:8089;

    location /api/v1/admin {
        return 404;
    }

    location = /api/v1/public/collect {
        proxy_pass $ingest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        client_max_body_size 21m;   # Uploads are limited to 20 MiB by the API.
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;        # Some responses are server-sent event streams.
        proxy_read_timeout 300s;
    }

    # The local test page is for development only.
    location /test-site/ {
        return 404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        try_files $uri /index.html;
    }
}
