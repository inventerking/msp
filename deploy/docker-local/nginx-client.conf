# Client app for the local Docker stack. Same routes as Traefik on the testing server: the
# customer origin never serves admin API routes.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;
    # Re-resolve the API's address so a restarted API container is found again.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8088;

    location /api/v1/admin {
        return 404;
    }

    location /api/ {
        client_max_body_size 21m;   # Uploads are limited to 20 MiB by the API.
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # Some responses are server-sent event streams.
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The local test page stands in for a customer's website, which loads the tracker and chat
    # widget with an inline script. It is never served by the testing or production setup.
    location /test-site/ {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri /index.html;
    }
}
