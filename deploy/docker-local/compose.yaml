# The whole app in Docker on one machine. Start it with `make docker-up`, then open:
#   client  http://localhost:8180   admin  http://localhost:8181   Mailpit  http://localhost:8025
# Local development only: APP_ENV=local, development database passwords, fake providers, no
# malware scanning and plain HTTP. Every email stays in Mailpit. Use deploy/testing for a server.
# It has its own project name, volumes and ports, so it can run beside `make up`.
name: msp-docker

x-backend-env: &backend-env
  APP_ENV: local
  HTTP_ADDR: 0.0.0.0:8088
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: msp_engine
  DB_APP_PASSWORD: dev_app
  DB_PLATFORM_PASSWORD: dev_platform
  DB_SYSTEM_PASSWORD: dev_system
  REDIS_ADDR: redis:6379
  SMTP_ADDR: mailpit:1025
  MAIL_FROM: no-reply@msp-engine.test
  APP_BASE_URL: http://localhost:${CLIENT_PORT:-8180}
  ALLOWED_ORIGINS: http://localhost:${CLIENT_PORT:-8180},http://localhost:${ADMIN_PORT:-8181}
  # nginx in the web containers is the only way in, and it sets X-Forwarded-For.
  TRUST_FORWARDED: "true"
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run make docker-up, which creates deploy/docker-local/.env}
  HMAC_KEY: ${HMAC_KEY:?run make docker-up, which creates deploy/docker-local/.env}
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: msp-files
  S3_ACCESS_KEY: dev_access_key
  S3_SECRET_KEY: dev_secret_key
  GOTENBERG_URL: http://gotenberg:3000
  FILE_SCANNER: allow-all
  RESEARCH_FETCHER: fake
  ASSESSMENT_PROBE: fake
  SENDING_DOMAIN_CHECK: fake

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true

services:
  migrate:
    image: msp-engine-backend:local
    build: {context: ../.., dockerfile: deploy/docker/backend.Dockerfile}
    command: [migrate]
    environment:
      APP_ENV: local
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: msp_engine
      DB_OWNER_PASSWORD: dev_owner
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true

  api:
    <<: *hardening
    image: msp-engine-backend:local
    command: [api]
    environment: *backend-env
    networks: [internal]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      seaweedfs: {condition: service_started}
    healthcheck:
      test: ["CMD", "/engine", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    <<: *hardening
    image: msp-engine-backend:local
    command: [worker]
    environment: *backend-env
    networks: [internal]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      seaweedfs: {condition: service_started}

  # Serves the built client app and passes /api/ to the API, except admin routes.
  client:
    <<: *hardening
    image: msp-engine-client:local
    build: {context: ../.., dockerfile: deploy/docker/web.Dockerfile, args: {APP: client}}
    volumes: ["./nginx-client.conf:/etc/nginx/conf.d/default.conf:ro"]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:${CLIENT_PORT:-8180}:8080"]
    networks: [edge, internal]
    depends_on:
      api: {condition: service_healthy}

  # Serves the built admin app and passes only /api/v1/admin/ to the API.
  admin:
    <<: *hardening
    image: msp-engine-admin:local
    build: {context: ../.., dockerfile: deploy/docker/web.Dockerfile, args: {APP: admin}}
    volumes: ["./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro"]
    tmpfs: [/tmp]
    ports: ["127.0.0.1:${ADMIN_PORT:-8181}:8080"]
    networks: [edge, internal]
    depends_on:
      api: {condition: service_healthy}

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev_superuser
    volumes:
      - pgdata:/var/lib/postgresql
      - ../local/postgres/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msp_engine"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=64", "-ip.bind=0.0.0.0"]
    volumes:
      - seaweed:/data
      - ../local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [internal]

  # It may load only its own temporary files and inline images, with JavaScript off.
  gotenberg:
    image: gotenberg/gotenberg:9.2
    restart: unless-stopped
    command: ["gotenberg", "--chromium-deny-list=^(?!(file:///tmp/|data:)).*", "--chromium-disable-javascript=true", "--api-port=3000"]
    networks: [internal]

  # The email sink. Nothing it receives leaves the machine.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    networks: [edge, internal]

networks:
  edge:
  # No route to the internet, so the backend cannot reach outside services.
  internal: {internal: true}

volumes:
  pgdata:
  seaweed:
