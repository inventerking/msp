# Testing server. Run ./init-env.sh once, then: docker compose up -d --build
# Keep the rules in docs/implementation/open-decisions.md: synthetic data only, and all email
# stays in Mailpit. Mailpit cannot deliver to real inboxes.
name: msp-testing

# Container logs rotate by size, so they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options: {max-size: 20m, max-file: "5"}

x-hardening: &hardening
  restart: unless-stopped
  logging: *logging
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true

x-backend-env: &backend-env
  APP_ENV: testing
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: msp_engine
  REDIS_ADDR: redis:6379
  SMTP_ADDR: mailpit:1025
  MAIL_FROM: no-reply@${APP_HOST}
  APP_BASE_URL: https://${APP_HOST}${PUBLIC_PORT_SUFFIX:-}
  ALLOWED_ORIGINS: https://${APP_HOST}${PUBLIC_PORT_SUFFIX:-},https://${ADMIN_HOST}${PUBLIC_PORT_SUFFIX:-}
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: msp-files
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  GOTENBERG_URL: http://gotenberg:3000
  FILE_SCANNER: clamav
  CLAMAV_ADDR: clamav:3310

x-runtime-secrets: &runtime-secrets
  DB_APP_PASSWORD: ${DB_APP_PASSWORD}
  DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD}
  DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  # During a key rotation: the new key's ID, and the old keys as id:base64 pairs (see the runbook).
  ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-env-1}
  ENCRYPTION_KEYS_PREVIOUS: ${ENCRYPTION_KEYS_PREVIOUS:-}
  HMAC_KEY: ${HMAC_KEY}

services:
  traefik:
    <<: *hardening
    image: traefik:v3.7
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:8000
      - --entrypoints.web.http.redirections.entrypoint.to=:${HTTPS_PORT:-443}
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:8443
      - --log.level=WARN
      - --accesslog=true
      - --accesslog.fields.names.ClientAddr=drop
      - --accesslog.fields.names.ClientHost=drop
      - --accesslog.fields.names.RequestPath=drop
      - --accesslog.fields.headers.defaultmode=drop
    environment:
      APP_HOST: ${APP_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:8000"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks: [edge]
    depends_on:
      api: {condition: service_healthy}
      ingest: {condition: service_healthy}

  migrate:
    image: msp-engine-backend:testing
    build: {context: ../.., dockerfile: deploy/docker/backend.Dockerfile}
    command: [migrate]
    environment:
      APP_ENV: testing
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: msp_engine
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
    networks: [internal]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true

  api:
    <<: *hardening
    image: msp-engine-backend:testing
    command: [api]
    environment:
      <<: [*backend-env, *runtime-secrets]
      HTTP_ADDR: 0.0.0.0:8088
      TRUST_FORWARDED: "true"
    networks: [edge, internal]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      seaweedfs: {condition: service_started}
    healthcheck:
      test: ["CMD", "/engine", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20

  # Serves only the visitor tracker endpoint, with its own small database pool. Traefik routes
  # /api/v1/public/collect here.
  ingest:
    <<: *hardening
    image: msp-engine-backend:testing
    command: [ingest]
    environment:
      <<: [*backend-env, *runtime-secrets]
      HTTP_ADDR: 0.0.0.0:8089
      TRUST_FORWARDED: "true"
      INGEST_DB_CONNS: "10"
    networks: [edge, internal]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/engine", "healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    <<: *hardening
    image: msp-engine-backend:testing
    command: [worker]
    environment:
      <<: [*backend-env, *runtime-secrets]
    networks: [internal]
    depends_on:
      migrate: {condition: service_completed_successfully}
      seaweedfs: {condition: service_started}

  client:
    <<: *hardening
    image: msp-engine-client:testing
    build: {context: ../.., dockerfile: deploy/docker/web.Dockerfile, args: {APP: client}}
    tmpfs: [/tmp]
    networks: [edge]

  admin:
    <<: *hardening
    image: msp-engine-admin:testing
    build: {context: ../.., dockerfile: deploy/docker/web.Dockerfile, args: {APP: admin}}
    tmpfs: [/tmp]
    networks: [edge]

  # WAL is archived continuously and encrypted by pgBackRest into the pgbackups volume. Run
  # ./backup.sh daily for base backups, and ./restore-drill.sh to prove a restore works. For an
  # off-host copy, put a second repository's settings in backup-offsite.env (see README).
  postgres:
    image: msp-engine-postgres:testing
    build: {context: ../.., dockerfile: deploy/docker/postgres.Dockerfile}
    restart: unless-stopped
    logging: *logging
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=60
    env_file:
      - path: ./backup-offsite.env
        required: false
    environment:
      PGBACKREST_STANZA: msp
      PGBACKREST_PG1_PATH: /var/lib/postgresql/18/docker
      PGBACKREST_REPO1_PATH: /backups
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?run init-env.sh or add BACKUP_CIPHER_PASS to .env}
      PGBACKREST_REPO1_RETENTION_FULL: "7"
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_START_FAST: "y"
      PGBACKREST_ARCHIVE_ASYNC: "n"
      PGBACKREST_LOG_LEVEL_FILE: "off"
      PGBACKREST_LOG_LEVEL_CONSOLE: warn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_PLATFORM_PASSWORD: ${DB_PLATFORM_PASSWORD}
      DB_SYSTEM_PASSWORD: ${DB_SYSTEM_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - pgbackups:/backups
      - ./postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d msp_engine"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.52
    restart: unless-stopped
    logging: *logging
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256", "-ip.bind=0.0.0.0"]
    volumes:
      - seaweed:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks: [internal]

  # No route out, and it refuses every URL except its own temporary files and inline images.
  gotenberg:
    image: gotenberg/gotenberg:9.2
    restart: unless-stopped
    logging: *logging
    command: ["gotenberg", "--chromium-deny-list=^(?!(file:///tmp/|data:)).*", "--chromium-disable-javascript=true", "--api-port=3000"]
    networks: [internal]

  # Needs internet access to update signatures, so it has its own network with a route out.
  # It is required here: without it, uploads stay blocked rather than being passed unscanned.
  clamav:
    image: clamav/clamav:1.5
    restart: unless-stopped
    logging: *logging
    networks: [internal, clamav_updates]

  # The email sink. Its web page is published to the server's loopback only: reach it by SSH tunnel.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    logging: *logging
    ports: ["127.0.0.1:${MAILPIT_PORT:-58025}:8025"]
    networks: [internal, mail_ui]

networks:
  edge:
  # No route to the internet, so the database and backend cannot reach or be reached from outside.
  internal: {internal: true}
  mail_ui:
  clamav_updates:

volumes:
  pgdata:
  # Keep a copy off this host too: a backup on the same disk does not survive losing the disk.
  pgbackups:
  seaweed:
