global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels: {environment: testing}

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:9100"]}]
  - job_name: ingest
    static_configs: [{targets: ["ingest:9100"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:9100"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
